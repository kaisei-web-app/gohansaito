<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut,createUserWithEmailAndPassword,signInWithEmailAndPassword,sendPasswordResetEmail,sendEmailVerification} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,setDoc,deleteDoc,query,where,onSnapshot,getDocs,orderBy,limit} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ★★ ここをあなたのFirebase設定に置き換える（手順は別紙） ★★ */
const firebaseConfig={apiKey:"AIzaSyCDJAoXQctbwZw_V7ZDeeYSL2M4tlXg-_4",authDomain:"gohan-map-17af5.firebaseapp.com",projectId:"gohan-map-17af5",appId:"1:170089376785:web:f5ce59b3263c4b58e655b0"};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(false){$('#lmsg').textContent='⚠ index.html の firebaseConfig を設定してください';$('#gbtn').disabled=true}
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let me=null,follows=[],followers=[],postsBy={},subs={},draft={img:null,rating:0,loc:null},picking=false,tmpM=null,editId=null,origLoc=null;
const GENRES=['ラーメン','カフェ','和食','洋食','中華','焼肉','スイーツ','居酒屋','その他'];
let ST={color:'#ff6b35',theme:'auto',pin:54,fs:15,map:''};try{Object.assign(ST,JSON.parse(localStorage.getItem('gm_st')||'{}'))}catch(e){}
const saveST=()=>{try{localStorage.setItem('gm_st',JSON.stringify(ST))}catch(e){}};
function applyST(){const r=document.documentElement;r.style.setProperty('--ac',ST.color);r.style.setProperty('--pin',ST.pin+'px');r.style.setProperty('--fs',ST.fs+'px');
 if(ST.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',ST.theme);
 const m=document.querySelector('meta[name=theme-color]');if(m)m.content=ST.color}
applyST();
let gf='';
const ucache={};
let filt='all';
const av=(id,name,photo,sz=30)=>photo?`<img class="av" style="width:${sz}px;height:${sz}px" src="${esc(photo)}" alt="">`:`<span class="av ini" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.5)}px">${esc((name||'?').trim().charAt(0))}</span>`;
async function loadUsers(ids){const need=[...new Set(ids)].filter(i=>i&&!ucache[i]);await Promise.all(need.map(async i=>{try{const d=await getDoc(doc(db,'users',i));ucache[i]=d.exists()?{name:d.data().name,photo:d.data().photo||''}:{name:'ゲスト',photo:''}}catch(e){}}))}

/* ---- auth ---- */
$('#gbtn').onclick=async()=>{$('#lmsg').textContent='';try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){$('#lmsg').textContent=e.code==='auth/popup-blocked'?'ポップアップがブロックされました。Safariの設定でポップアップを許可して、もう一度押してください':e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request'?'':'ログイン失敗：'+e.code}};
let signup=false,pendingName='';
const setMode=b=>{signup=b;$('#tLogin').classList.toggle('on',!b);$('#tSign').classList.toggle('on',b);$('#lname').style.display=b?'':'none';$('#lgo').textContent=b?'アカウントを作る':'ログイン';$('#lforgot').style.display=b?'none':'';$('#lpass').autocomplete=b?'new-password':'current-password';$('#lmsg').textContent=''};
$('#tLogin').onclick=()=>setMode(false);$('#tSign').onclick=()=>setMode(true);
const errJa=c=>({'auth/invalid-email':'メールアドレスの形が正しくありません','auth/email-already-in-use':'このメールアドレスはすでに登録されています。ログインしてください','auth/weak-password':'パスワードは6文字以上にしてください','auth/invalid-credential':'メールアドレスかパスワードが違います','auth/user-not-found':'メールアドレスかパスワードが違います','auth/wrong-password':'メールアドレスかパスワードが違います','auth/too-many-requests':'試行回数が多すぎます。しばらくしてからやり直してください','auth/network-request-failed':'通信に失敗しました','auth/operation-not-allowed':'メールでのログインが有効になっていません（Firebaseの設定が必要です）'}[c]||'失敗しました：'+c);
$('#lgo').onclick=async()=>{const m=$('#lmail').value.trim(),pw=$('#lpass').value,msg=$('#lmsg'),b=$('#lgo');msg.textContent='';
 if(!m||!pw)return msg.textContent='メールアドレスとパスワードを入れてください';
 if(signup&&!$('#lname').value.trim())return msg.textContent='表示名を入れてください';
 b.disabled=true;
 try{if(signup){pendingName=$('#lname').value.trim();const c=await createUserWithEmailAndPassword(auth,m,pw);sendEmailVerification(c.user).catch(()=>{})}else await signInWithEmailAndPassword(auth,m,pw)}
 catch(e){msg.textContent=errJa(e.code)}b.disabled=false};
$('#lforgot').onclick=async()=>{const m=$('#lmail').value.trim(),msg=$('#lmsg');if(!m)return msg.textContent='上にメールアドレスを入れてから押してください';
 try{await sendPasswordResetEmail(auth,m);msg.textContent='再設定のメールを送りました。届かないときは迷惑メールも確認してください'}catch(e){msg.textContent=errJa(e.code)}};
onAuthStateChanged(auth,async u=>{
 if(!u){me=null;$('#login').style.display='flex';return}
 const ref=doc(db,'users',u.uid);let d=await getDoc(ref);
 if(!d.exists()){const name=u.displayName||pendingName||(u.email||'ゲスト').split('@')[0];await setDoc(ref,{name,nameLower:name.toLowerCase(),photo:u.photoURL||''});d=await getDoc(ref)}
 pendingName='';const ud=d.data();me={uid:u.uid,name:ud.name,photo:ud.photo||'',email:u.email||''};ucache[me.uid]={name:me.name,photo:me.photo};
 $('#login').style.display='none';showMe();
 onSnapshot(query(collection(db,'follows'),where('from','==',me.uid)),s=>{follows=s.docs.map(d=>d.data());sync()});
 onSnapshot(query(collection(db,'follows'),where('to','==',me.uid)),s=>{followers=s.docs.map(d=>d.data());sync()});
 setTimeout(()=>map.invalidateSize(),100);locate(false);
});
const mutual=()=>{const f=new Set(followers.map(x=>x.from));return follows.filter(x=>f.has(x.to)).map(x=>x.to)};

/* ---- 投稿の購読（自分＋相互フォローの人だけ） ---- */
function sync(){const want=new Set([me.uid,...mutual()]);
 for(const id of Object.keys(subs))if(!want.has(id)){subs[id]();delete subs[id];delete postsBy[id]}
 for(const id of want)if(!subs[id])subs[id]=onSnapshot(query(collection(db,'posts'),where('uid','==',id)),s=>{postsBy[id]=s.docs.map(d=>({id:d.id,...d.data()}));drawPins();loadUsers([id]).then(buildFlt)},()=>{});
 loadUsers(mutual()).then(buildFlt);buildFlt();drawPins();if($('#pg-fol').classList.contains('on'))renderFol()}

/* ---- map ---- */
const map=L.map('map',{zoomControl:false}).setView([35.68,139.76],13);
L.control.zoom({position:'bottomleft'}).addTo(map);
const gsi=(k,ext='png')=>L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/'+k+'/{z}/{x}/{y}.'+ext,{maxNativeZoom:18,maxZoom:19,attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">地理院タイル</a>'});
const base={'標準':gsi('std'),'淡色':gsi('pale'),'航空写真':gsi('seamlessphoto','jpg'),'OSM':L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'})};
base['標準'].addTo(map);const ctrl=L.control.layers(base,null,{position:'bottomleft',collapsed:true}).addTo(map);
if(ST.map&&ST.map!=='やわらか'&&base[ST.map]){map.removeLayer(base['標準']);base[ST.map].addTo(map)}
/* Apple風のやわらかいベクター地図（OpenFreeMap・無料・キー不要）。読み込めなければ地理院の標準地図のまま */
(async()=>{try{if(!L.maplibreGL||!window.maplibregl)throw 0;
 const st=await (await fetch('https://tiles.openfreemap.org/styles/liberty')).json();
 st.layers.forEach(l=>{if(l.layout&&l.layout['text-field'])l.layout['text-field']=['coalesce',['get','name:ja'],['get','name']]});
 const vec=L.maplibreGL({style:st,attribution:'© OpenStreetMap contributors, <a href="https://openfreemap.org" target="_blank">OpenFreeMap</a> © OpenMapTiles'});
 base['やわらか']=vec;ctrl.addBaseLayer(vec,'やわらか');if(!ST.map||ST.map==='やわらか'){Object.values(base).forEach(l=>l!==vec&&map.hasLayer(l)&&map.removeLayer(l));vec.addTo(map)}
 }catch(e){console.warn('vector map unavailable',e)}})();
const layer=L.layerGroup().addTo(map);
const shown=()=>Object.values(postsBy).flat().filter(p=>(!gf||p.genre===gf)&&(filt==='all'||(filt==='me'?p.uid===me.uid:filt==='others'?p.uid!==me.uid:p.uid===filt)));
function buildFlt(){const ids=mutual();if(filt!=='all'&&filt!=='me'&&filt!=='others'&&!ids.includes(filt))filt='all';
 const o=[['all','👥 全体'],['me','🙋 自分だけ'],['others','👥 自分以外（友達だけ）'],...ids.map(i=>[i,'👤 '+((ucache[i]||{}).name||'友達')+'の投稿'])];
 $('#flt').innerHTML=o.map(([v,t])=>`<option value="${esc(v)}"${v===filt?' selected':''}>${esc(t)}</option>`).join('')}
$('#flt').onchange=e=>{filt=e.target.value;drawPins();const l=shown();if(l.length)map.fitBounds(l.map(p=>[p.lat,p.lng]),{maxZoom:16,padding:[60,60]})};
function buildG(){$('#gflt').innerHTML='<option value="">🏷 すべてのジャンル</option>'+GENRES.map(g=>`<option value="${g}"${g===gf?' selected':''}>${g}</option>`).join('')}
buildG();$('#gflt').onchange=e=>{gf=e.target.value;drawPins();const l=shown();if(l.length)map.fitBounds(l.map(p=>[p.lat,p.lng]),{maxZoom:16,padding:[60,60]})};
function drawPins(){if(me&&$('#pg-list').classList.contains('on'))renderList();if(me&&$('#pg-sum').classList.contains('on'))renderSum();layer.clearLayers();const g={};
 shown().forEach(p=>{const k=Math.round(p.lat/.0003)+','+Math.round(p.lng/.0003);(g[k]=g[k]||[]).push(p)});
 Object.values(g).forEach(list=>{list.sort((a,b)=>b.ts-a.ts);const p=list[0],n=list.length;
  const ic=L.divIcon({className:'',html:`<div class="pin"><div class="ph" style="background-image:url(${esc(p.img)})"></div><i>★${p.rating}</i>${n>1?`<b class="cnt">${n}</b>`:''}</div>`,iconSize:[ST.pin,ST.pin],iconAnchor:[ST.pin/2,ST.pin+11]});
  L.marker([p.lat,p.lng],{icon:ic}).on('click',()=>openSheet(list)).addTo(layer)})}
let meM=null;
$('#here').onclick=()=>{if(!navigator.geolocation)return alert('この端末では現在地を使えません');const b=$('#here');b.disabled=true;
 navigator.geolocation.getCurrentPosition(p=>{b.disabled=false;const ll=[p.coords.latitude,p.coords.longitude];map.setView(ll,17);if(meM)map.removeLayer(meM);meM=L.circleMarker(ll,{radius:8,color:'#fff',weight:3,fillColor:'#2a7de1',fillOpacity:1}).addTo(map)},()=>{b.disabled=false;alert('現在地を取得できません。位置情報の許可と、端末の位置情報サービスがオンか確認してください。')},{enableHighAccuracy:true,timeout:10000})};
function locate(jump=true){navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{map.setView([p.coords.latitude,p.coords.longitude],16)},()=>{},{timeout:8000})}
map.on('click',e=>{if(!picking)return;draft.loc={lat:e.latlng.lat,lng:e.latlng.lng};if(tmpM)map.removeLayer(tmpM);tmpM=L.marker(e.latlng).addTo(map);
 const b=$('#banner');b.innerHTML='ここでOK？ <button class="sec" id="okp" style="padding:3px 10px">決定</button>';$('#okp').onclick=()=>{picking=false;b.style.display='none';if(tmpM)map.removeLayer(tmpM);tmpM=null;setLoc();$('#comp').style.display='block'}});
async function geocode(q){const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=jp&accept-language=ja&q='+encodeURIComponent(q));return await r.json()}
async function rev(l){try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&zoom=18&accept-language=ja&lat=${l.lat}&lon=${l.lng}`);return (await r.json()).display_name||''}catch(e){return ''}}
$('#psb').onclick=async()=>{const q=$('#ps').value.trim();if(!q)return;const res=$('#res');res.style.display='block';res.innerHTML='<div class="sub" style="padding:10px">検索中…</div>';
 try{const l=await geocode(q);res.innerHTML=l.length?l.map((r,i)=>`<div class="row" data-i="${i}" style="padding:10px 12px;cursor:pointer">${esc(r.display_name.split(',').slice(0,3).join(' '))}</div>`).join(''):'<div class="sub" style="padding:10px">見つかりません。駅名や町名で試してください</div>';
  res.onclick=e=>{const d=e.target.closest('[data-i]');if(!d)return;const r=l[+d.dataset.i];map.setView([+r.lat,+r.lon],17);res.style.display='none';$('#ps').blur()}}
 catch(e){res.innerHTML='<div class="sub" style="padding:10px">検索に失敗しました</div>'}};
$('#psx').onclick=()=>{$('#ps').value='';$('#res').style.display='none';$('#ps').focus()};
const tl=document.querySelector('.tools');L.DomEvent.disableClickPropagation(tl);L.DomEvent.disableScrollPropagation(tl);
$('#ps').onkeydown=e=>e.key==='Enter'&&$('#psb').click();

/* ---- 詳細 ---- */
function openSheet(list){const s=$('#sheet'),n=list.length;
 const sl=p=>`<div class="sl"><img class="photo" src="${esc(p.img)}"><h3 style="margin:0">${esc(p.shop)||'（店名なし）'}</h3>
 <span class="stars sm">${[1,2,3,4,5].map(i=>`<span class="${i<=p.rating?'f':''}">★</span>`).join('')}</span>
 <div class="sub">${av(p.uid,(ucache[p.uid]||{}).name||p.name,(ucache[p.uid]||{}).photo,24)}${esc((ucache[p.uid]||{}).name||p.name)}${p.uid===me.uid?'（自分）':''} ・ ${new Date(p.ts).toLocaleDateString('ja-JP')}${p.edited?'（編集済み）':''}</div>
 ${p.genre?`<div style="margin:6px 0"><span class="tag" style="margin-left:0">🏷 ${esc(p.genre)}</span></div>`:''}${p.amount>0?`<div style="margin:6px 0">💴 ¥${p.amount.toLocaleString('ja-JP')}</div>`:''}${p.addr?`<div style="margin:6px 0">📍 ${esc(p.addr)}</div>`:''}${p.comment?`<p>${esc(p.comment)}</p>`:''}
 <p><a href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}" target="_blank" rel="noopener">Googleマップで開く ↗</a> 　<button class="sec" data-share="${esc(p.id)}">↗ 共有</button></p>
 ${p.uid===me.uid?`<button class="sec" data-edit="${esc(p.id)}">✏️ 編集</button> <button class="sec" data-del="${esc(p.id)}">削除</button>`:''}</div>`;
 s.innerHTML=`<button class="x" id="cl">×</button>${n>1?`<div class="sub" id="ct" style="margin-bottom:8px">1 / ${n}　← 左右にスワイプ →</div>`:''}<div class="car">${list.map(sl).join('')}</div>`;
 s.style.display='block';$('#cl').onclick=()=>s.style.display='none';
 const car=s.querySelector('.car');car.onscroll=()=>{const i=Math.round(car.scrollLeft/(car.clientWidth+12));const c=$('#ct');if(c)c.textContent=`${Math.min(i+1,n)} / ${n}　← 左右にスワイプ →`};
 s.querySelectorAll('[data-share]').forEach(b=>b.onclick=async()=>{const p=list.find(x=>x.id===b.dataset.share);if(!p)return;const url='https://www.google.com/maps/search/?api=1&query='+p.lat+','+p.lng,t=(p.shop||'ごはん')+' ★'+p.rating;
  try{if(navigator.share)await navigator.share({title:t,text:t,url});else{await navigator.clipboard.writeText(t+' '+url);alert('リンクをコピーしました')}}catch(e){}});
 s.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const p=list.find(x=>x.id===b.dataset.edit);if(!p)return;
  editId=p.id;origLoc={lat:p.lat,lng:p.lng};draft={img:p.img,rating:p.rating,genre:p.genre||'',loc:{lat:p.lat,lng:p.lng}};drawGn();
  $('#shop').value=p.shop||'';$('#cm').value=p.comment||'';$('#amt').value=p.amount>0?p.amount:'';$('#pre').src=p.img;$('#pre').style.display='block';
  drawSt();setLoc();$('#ctt').textContent='投稿を編集';$('#send').textContent='変更を保存';$('#comp').style.display='block'});
 s.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('削除しますか？')){await deleteDoc(doc(db,'posts',b.dataset.del));s.style.display='none'}})}

/* ---- 投稿 ---- */
const drawSt=()=>$('#st').innerHTML=[1,2,3,4,5].map(i=>`<span data-i="${i}" class="${i<=draft.rating?'f':''}">★</span>`).join('');drawSt();
$('#st').onclick=e=>{if(e.target.dataset.i){draft.rating=+e.target.dataset.i;drawSt()}};
const setLoc=()=>$('#locTxt').textContent=draft.loc?`場所：設定済み（${draft.loc.lat.toFixed(4)}, ${draft.loc.lng.toFixed(4)}）`:'場所：未設定';
const drawGn=()=>$('#gn').innerHTML=GENRES.map(g=>`<span class="chip${draft.genre===g?' on':''}" data-g="${g}">${g}</span>`).join('');
$('#gn').onclick=e=>{const g=e.target.dataset.g;if(!g)return;draft.genre=draft.genre===g?'':g;drawGn()};drawGn();
const amt=()=>parseInt(($('#amt').value||'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/[^\d]/g,''))||0;
$('#fab').onclick=()=>{resetComp();$('#comp').style.display='block'};$('#cc').onclick=()=>{if(editId)resetComp();$('#comp').style.display='none'};
$('#pick').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);draft.img=c.toDataURL('image/jpeg',.7);$('#pre').src=draft.img;$('#pre').style.display='block'};im.src=r.result};r.readAsDataURL(f)};
$('#gps').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{draft.loc={lat:p.coords.latitude,lng:p.coords.longitude};setLoc()},()=>alert('現在地を取得できません。位置情報の許可をご確認ください。'),{enableHighAccuracy:true,timeout:10000}):alert('非対応です');
$('#onmap').onclick=()=>{picking=true;$('#comp').style.display='none';const b=$('#banner');b.textContent='地図をタップして場所を選んでください';b.style.display='block'};
function resetComp(){editId=null;origLoc=null;draft={img:null,rating:0,loc:null};drawGn();$('#pre').style.display='none';$('#shop').value='';$('#cm').value='';$('#amt').value='';drawSt();setLoc();$('#ctt').textContent='ごはんを投稿';$('#send').textContent='地図に投稿する'}
$('#send').onclick=async()=>{if(!draft.img)return alert('写真を撮ってください');if(!draft.rating)return alert('星をつけてください');if(!draft.loc)return alert('場所を設定してください');
 const b=$('#send');b.disabled=true;
 try{const data={genre:draft.genre||'',shop:$('#shop').value.trim(),comment:$('#cm').value.trim(),rating:draft.rating,amount:amt(),lat:draft.loc.lat,lng:draft.loc.lng,img:draft.img};
  if(editId){const moved=!origLoc||origLoc.lat!==draft.loc.lat||origLoc.lng!==draft.loc.lng;
   if(moved)data.addr=(await rev(draft.loc)).split(',').slice(0,3).join(' ');
   data.edited=Date.now();await setDoc(doc(db,'posts',editId),data,{merge:true});$('#sheet').style.display='none'}
  else{const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);const addr=(await rev(draft.loc)).split(',').slice(0,3).join(' ');
   await setDoc(doc(db,'posts',id),{...data,uid:me.uid,name:me.name,addr,ts:Date.now()})}
  map.setView([draft.loc.lat,draft.loc.lng],17);resetComp();$('#comp').style.display='none'}
 catch(e){alert('保存に失敗：'+e.code)}b.disabled=false};

/* ---- フォロー ---- */
const isF=id=>follows.some(f=>f.to===id),isR=id=>followers.some(f=>f.from===id);
const stat=id=>isF(id)&&isR(id)?'<span class="tag">相互</span>':isR(id)?'<span class="tag" style="background:var(--sub)">フォローされています</span>':'';
const rowH=(id,name)=>{const u=ucache[id]||{name,photo:''};return `<div class="row"><div>${av(id,u.name||name,u.photo,32)}${esc(u.name||name)}${stat(id)}</div><button class="sec ${isF(id)?'on':''}" data-f="${esc(id)}" data-n="${esc(u.name||name)}">${isF(id)?'フォロー中':'フォローする'}</button></div>`};
async function renderFol(){const m=new Map();follows.forEach(f=>m.set(f.to,f.toName));followers.forEach(f=>{if(!m.has(f.from))m.set(f.from,f.fromName)});
 const draw=()=>$('#flist').innerHTML=m.size?[...m].map(([id,n])=>rowH(id,n)).join(''):'<div class="sub">まだいません。上の検索から探してみましょう。</div>';draw();await loadUsers([...m.keys()]);draw()}
document.addEventListener('click',async e=>{const id=e.target.dataset&&e.target.dataset.f;if(!id)return;e.target.disabled=true;const ref=doc(db,'follows',me.uid+'_'+id);
 try{isF(id)?await deleteDoc(ref):await setDoc(ref,{from:me.uid,to:id,fromName:me.name,fromPhoto:'',toName:e.target.dataset.n,toPhoto:'',ts:Date.now()})}catch(x){alert('失敗：'+x.code)}});
let qt;$('#q').oninput=e=>{clearTimeout(qt);const v=e.target.value.trim().toLowerCase();qt=setTimeout(async()=>{if(!v){$('#hits').innerHTML='';return}
 try{const s=await getDocs(query(collection(db,'users'),where('nameLower','>=',v),where('nameLower','<=',v+'\uf8ff'),limit(10)));
  const l=s.docs.filter(d=>d.id!==me.uid);$('#hits').innerHTML=l.length?l.map(d=>{ucache[d.id]={name:d.data().name,photo:d.data().photo||''};return rowH(d.id,d.data().name)}).join(''):'<div class="sub">見つかりません</div>'}catch(x){$('#hits').innerHTML='<div class="sub">検索に失敗しました</div>'}},300)};

/* ---- 一覧（新しい順） ---- */
function renderList(){const l=shown().slice().sort((a,b)=>b.ts-a.ts);
 $('#llist').innerHTML=l.length?l.map(p=>`<div class="li" data-pid="${esc(p.id)}"><div class="th" style="background-image:url(${esc(p.img)})"></div><div style="min-width:0"><b>${esc(p.shop)||'（店名なし）'}</b>
  <span class="stars sm">${[1,2,3,4,5].map(i=>`<span class="${i<=p.rating?'f':''}">★</span>`).join('')}</span>${p.genre?` <span class="tag" style="margin-left:4px">${esc(p.genre)}</span>`:''}
  <div class="sub">${esc((ucache[p.uid]||{}).name||p.name)} ・ ${new Date(p.ts).toLocaleDateString('ja-JP')}${p.amount>0?' ・ ¥'+p.amount.toLocaleString('ja-JP'):''}</div></div></div>`).join(''):'<div class="sub">表示できる投稿がありません。地図の上のボタンで、表示を切り替えられます。</div>'}
$('#llist').onclick=e=>{const d=e.target.closest('[data-pid]');if(!d)return;const p=shown().find(x=>x.id===d.dataset.pid);if(!p)return;
 document.querySelector('nav button[data-p=map]').click();setTimeout(()=>{map.setView([p.lat,p.lng],17);const near=shown().filter(x=>Math.round(x.lat/.0003)===Math.round(p.lat/.0003)&&Math.round(x.lng/.0003)===Math.round(p.lng/.0003)).sort((a,b)=>b.ts-a.ts);openSheet(near)},80)};
/* ---- 集計（自分の投稿の合計金額） ---- */
const yen=n=>'¥'+n.toLocaleString('ja-JP');
function renderSum(){const my=(postsBy[me.uid]||[]).filter(p=>p.amount>0),now=new Date(),ym=d=>d.getFullYear()+'年'+(d.getMonth()+1)+'月';
 const all=my.reduce((a,p)=>a+p.amount,0),mo=my.filter(p=>ym(new Date(p.ts))===ym(now)).reduce((a,p)=>a+p.amount,0);
 $('#sMonth').textContent=yen(mo);$('#sAll').textContent=yen(all);
 $('#sInfo').textContent=my.length?`金額つきの投稿 ${my.length}件 ／ 1回あたり平均 ${yen(Math.round(all/my.length))}`:'金額を入れて投稿すると、ここに合計が出ます。';
 const m={};my.forEach(p=>{const k=ym(new Date(p.ts));m[k]=(m[k]||0)+p.amount});
 const keys=Object.keys(m).sort((a,b)=>{const f=x=>x.replace(/年|月/g,'-').split('-').map(Number);const [ay,am]=f(a),[by,bm]=f(b);return by*12+bm-(ay*12+am)});
 $('#sList').innerHTML=keys.length?keys.map(k=>`<div class="row"><div>${k}</div><b>${yen(m[k])}</b></div>`).join(''):'<div class="sub">まだありません</div>'}
/* ---- 詳細を開いている間は、地図の操作ボタンを隠す ---- */
new MutationObserver(()=>$('#pg-map').classList.toggle('so',$('#sheet').style.display==='block')).observe($('#sheet'),{attributes:true,attributeFilter:['style']});
/* ---- 設定（テーマカラー・外観・ピン・文字） ---- */
const COLORS=['#ff6b35','#e8336d','#d93025','#2e9e5b','#2a7de1','#8e44ad'];
const drawSw=()=>$('#sw').innerHTML=COLORS.map(c=>`<span class="sw${c===ST.color?' on':''}" data-c="${c}" style="background:${c}"></span>`).join('');
drawSw();$('#sTheme').value=ST.theme;$('#sPin').value=String(ST.pin);$('#sFs').value=String(ST.fs);
$('#sw').onclick=e=>{const c=e.target.dataset.c;if(!c)return;ST.color=c;saveST();applyST();drawSw()};
$('#sTheme').onchange=e=>{ST.theme=e.target.value;saveST();applyST();drawMap2()};
$('#sPin').onchange=e=>{ST.pin=+e.target.value;saveST();applyST();drawPins()};
$('#sFs').onchange=e=>{ST.fs=+e.target.value;saveST();applyST()};
const drawMap2=()=>{};
map.on('baselayerchange',e=>{ST.map=e.name;saveST()});
/* ---- 最新版に更新（ホーム画面のアプリは再読み込みできないため） ---- */
const APP_VER='2026.10.05-12';
const refreshApp=()=>location.replace(location.pathname+'?r='+Date.now());
$('#rf').onclick=refreshApp;$('#pupd').onclick=refreshApp;$('#pver').textContent='バージョン '+APP_VER;
/* ---- プロフィール（名前・アイコンの変更） ---- */
let pDraft='';
const showMe=()=>{$('#me').innerHTML=av(me.uid,me.name,me.photo,28)+esc(me.name)};
$('#me').onclick=()=>{pDraft=me.photo;$('#pname').value=me.name;$('#pmail').textContent=me.email||'';$('#pav').innerHTML=av(me.uid,me.name,pDraft,96);$('#prof').style.display='block'};
$('#pc').onclick=()=>$('#prof').style.display='none';
$('#ppick').onclick=()=>$('#pfile').click();
$('#pfile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=256;
  c.getContext('2d').drawImage(im,(im.width-k)/2,(im.height-k)/2,k,k,0,0,256,256);pDraft=c.toDataURL('image/jpeg',.8);$('#pav').innerHTML=av(me.uid,$('#pname').value,pDraft,96)};im.src=r.result};r.readAsDataURL(f);e.target.value=''};
$('#psave').onclick=async()=>{const n=$('#pname').value.trim();if(!n)return alert('表示名を入れてください');const b=$('#psave');b.disabled=true;
 try{await setDoc(doc(db,'users',me.uid),{name:n,nameLower:n.toLowerCase(),photo:pDraft||''},{merge:true});me.name=n;me.photo=pDraft||'';ucache[me.uid]={name:n,photo:me.photo};showMe();$('#prof').style.display='none'}
 catch(x){alert('保存に失敗：'+x.code)}b.disabled=false};
$('#plogout').onclick=()=>{if(confirm('ログアウトしますか？')){signOut(auth);$('#prof').style.display='none'}};
/* ---- tabs ---- */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{const p=b.dataset.p;document.querySelectorAll('.page').forEach(e=>e.classList.toggle('on',e.id==='pg-'+p));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));if(p==='map')setTimeout(()=>map.invalidateSize(),50);else if(p==='list')renderList();else if(p==='sum')renderSum();else renderFol()});
</script></body></html>
